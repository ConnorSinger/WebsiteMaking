<main>

    <body>
        <!--Here we display an error if anything goes wrong when we reload the page-->
        <h1>{{error}}</h1>

        <!--Here is the route we use to submit the login form-->
        <form action="{{ url_for('loggingIn') }}" method="POST">
            <h1>Login To Your Account</h1>
                <div class = "input-box">
                    <input type = "text" name = "username" placeholder = "Username" required>
                </div>
                <div class = "password-box">
                    <input type = "password" name = "password" placeholder = "Password" required>
                </div>
            <button type="submit">Login</button>
        </form>
    </body>

    <!--Here we have the route to go to the registration screen-->
    <form action="{{ url_for('registerScreen') }}" method="GET">
        <button type="submit">Register</button>
    </form>
</main>
